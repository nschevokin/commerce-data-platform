version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: purchased_at
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - relationships: {to: ref('order_status_contract'), field: order_status}

  - name: stg_order_items
    tests:
      - unique_combination: {columns: [order_id, order_item_id]}
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null, {positive: {}}]
      - name: product_id
        tests: [not_null]
      - name: seller_id
        tests: [not_null]
      - name: price_brl
        tests: [not_null]
      - name: freight_brl
        tests: [not_null]

  - name: stg_order_payments
    tests:
      - unique_combination: {columns: [order_id, payment_sequential]}
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_sequential
        tests: [not_null, {positive: {}}]
      - name: payment_type
        tests: [not_null]
      - name: payment_installments
        tests: [not_null]
      - name: recorded_payment_brl
        tests: [not_null]

  - name: dim_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: customer_unique_id
        tests: [not_null]
  - name: dim_sellers
    columns:
      - name: seller_id
        tests: [not_null, unique]
  - name: dim_products
    columns:
      - name: product_id
        tests: [not_null, unique]
  - name: dim_date
    columns:
      - name: calendar_date
        tests: [not_null, unique]

  - name: fct_order_items
    tests:
      - unique_combination: {columns: [order_id, order_item_id]}
    columns:
      - name: order_id
        tests:
          - relationships: {to: ref('fct_orders'), field: order_id}
      - name: product_id
        tests:
          - relationships: {to: ref('dim_products'), field: product_id}
      - name: seller_id
        tests:
          - relationships: {to: ref('dim_sellers'), field: seller_id}
  - name: fct_payments
    tests:
      - unique_combination: {columns: [order_id, payment_sequential]}
    columns:
      - name: order_id
        tests:
          - relationships: {to: ref('fct_orders'), field: order_id}
  - name: fct_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: is_eligible
        tests: [not_null]
      - name: customer_id
        tests:
          - relationships: {to: ref('dim_customers'), field: customer_id}

  - name: mart_sales_daily
    columns:
      - name: purchase_date
        tests: [not_null, unique]
  - name: mart_category_daily
    tests:
      - unique_combination: {columns: [purchase_date, category_label]}
  - name: mart_delivery_cohorts
    tests:
      - unique_combination: {columns: [purchase_month, customer_state]}
